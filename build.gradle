plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'sponge'
		url = 'https://repo.spongepowered.org/repository/maven-public/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}

tasks.register('generateReleases') {
	group = 'build'
	description = 'Compiles mod JAR for MC 1.21.x and creates/updates RELEASES.md release chart.'

	def jarTask = tasks.findByName('remapJar') ?: tasks.jar
	dependsOn jarTask

	def releasesFile = file("RELEASES.md")

	inputs.file(jarTask.archiveFile)
	outputs.file(releasesFile)

	doLast {
		def targetJarTask = tasks.findByName('remapJar') ?: tasks.jar
		def jarFile = targetJarTask.archiveFile.get().asFile
		def relativeJarPath = project.projectDir.toPath().relativize(jarFile.toPath()).toString().replace('\\', '/')
		def targetMcVersion = project.findProperty("minecraft_version") ?: "1.21.4"
		def modVersion = project.version.toString()
		def modName = project.findProperty("archives_base_name") ?: project.name
		def timestamp = java.time.Instant.now().toString()

		def content = """# Fabric Harvester Release Chart

| Target MC Version | Mod Version | Built Jar Artifact | Status | Built Timestamp |
|---|---|---|---|---|
| 1.21.x | \${modVersion} | \${relativeJarPath} | Release Ready | \${timestamp} |

## Release Details

### Minecraft 1.21.x
- **Mod Name**: \${modName}
- **Mod Version**: `\${modVersion}`
- **Target Minecraft Version**: `1.21.x` (MC \${targetMcVersion})
- **Artifact Path**: `\${relativeJarPath}`
- **Build Task**: `generateReleases`
"""

		releasesFile.text = content
		logger.lifecycle("[generateReleases] Successfully updated RELEASES.md with artifact path: \${relativeJarPath}")
	}
}

tasks.register('release') {
	group = 'build'
	description = 'Alias for generateReleases.'
	dependsOn tasks.generateReleases
}

import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	systemProperty "fabricHarvester.modVersion", project.version.toString()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "LICENSE_${projectName}" }
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Minecraft 26.2 is distributed with official names, so Loom's mapping-free
// plugin produces the distributable artifact directly from the jar task.
def releaseJar = tasks.named("jar").flatMap { it.archiveFile }
def releaseChecksum = layout.buildDirectory.file(
	"checksums/${project.archives_base_name}-${project.version}.jar.sha256"
)

tasks.register("checksumRelease") {
	group = "build"
	description = "Writes a SHA-256 checksum for the remapped release JAR."
	dependsOn tasks.named("jar")
	inputs.file(releaseJar)
	outputs.file(releaseChecksum)

	doLast {
		def jarFile = releaseJar.get().asFile
		def digest = MessageDigest.getInstance("SHA-256")
		jarFile.withInputStream { input ->
			byte[] buffer = new byte[8192]
			int read
			while ((read = input.read(buffer)) != -1) {
				digest.update(buffer, 0, read)
			}
		}

		def checksumFile = releaseChecksum.get().asFile
		checksumFile.parentFile.mkdirs()
		checksumFile.text = "${digest.digest().encodeHex()}  ${jarFile.name}${System.lineSeparator()}"
	}
}

tasks.named("checksumRelease") {
	mustRunAfter tasks.named("test")
}

tasks.register("release") {
	group = "build"
	description = "Builds, tests, remaps, and checksums the reproducible release artifact."
	dependsOn tasks.named("build")
	dependsOn tasks.named("checksumRelease")
}

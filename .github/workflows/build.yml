name: build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
          cache: gradle

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build release on Linux
        if: runner.os != 'Windows'
        run: ./gradlew clean release

      - name: Build release on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean release

      - name: Upload remapped JAR and checksum
        uses: actions/upload-artifact@v6
        with:
          name: fabric-harvester-1.6.0-${{ runner.os }}
          path: |
            build/libs/fabric_harvester-1.6.0.jar
            build/checksums/fabric_harvester-1.6.0.jar.sha256
          if-no-files-found: error

